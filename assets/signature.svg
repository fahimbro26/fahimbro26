<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="LIFE IS BLUE.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#02050D"/>
      <stop offset="1" stop-color="#06122B"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="220" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="218" rx="13" fill="none" stroke="#0A84FF" stroke-opacity="0.4"/>

  <text x="40" y="52" font-family="'Fira Code','Courier New',monospace" font-size="16" fill="#0A84FF">$ echo "$MOTTO"</text>

  <text x="450" y="130" text-anchor="middle" font-family="'Fira Code','Courier New',monospace" font-size="64" font-weight="700" letter-spacing="4" fill="#00E5FF" filter="url(#glow)">
    LIFE IS BLUE.
    <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite"/>
  </text>

  <rect x="150" y="160" width="600" height="2" fill="url(#line)"/>
  <text x="450" y="195" text-anchor="middle" font-family="'Fira Code','Courier New',monospace" font-size="14" fill="#6FA8DC">fahimbro26 // Dhaka, Bangladesh</text>
</svg>
