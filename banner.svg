<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Abdullah Al Fahim, @fahimbro26, Vibe Coder, AI-Assisted Developer, Photography Enthusiast" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02050D"/>
      <stop offset="0.55" stop-color="#06122B"/>
      <stop offset="1" stop-color="#020611"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0A84FF" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="14" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="318" rx="13" fill="none" stroke="#0A84FF" stroke-opacity="0.45"/>

  <!-- terminal title bar -->
  <rect x="1" y="1" width="1198" height="40" rx="13" fill="#0A1A3A" fill-opacity="0.8"/>
  <circle cx="30" cy="21" r="6" fill="#0A84FF"/>
  <circle cx="52" cy="21" r="6" fill="#00B4FF"/>
  <circle cx="74" cy="21" r="6" fill="#00E5FF"/>
  <text x="600" y="26" text-anchor="middle" font-family="'Fira Code','Courier New',monospace" font-size="14" fill="#6FA8DC">fahimbro26@dhaka:~</text>

  <!-- prompt -->
  <text x="60" y="95" font-family="'Fira Code','Courier New',monospace" font-size="20" fill="#0A84FF">$ whoami</text>

  <!-- name -->
  <text x="60" y="165" font-family="'Fira Code','Courier New',monospace" font-size="62" font-weight="700" fill="#00E5FF" filter="url(#glow)">ABDULLAH AL FAHIM</text>

  <!-- handle -->
  <text x="62" y="205" font-family="'Fira Code','Courier New',monospace" font-size="26" fill="#4DA3FF">@fahimbro26</text>

  <!-- glowing line -->
  <rect x="60" y="225" width="1080" height="2" fill="url(#line)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- role -->
  <text x="60" y="268" font-family="'Fira Code','Courier New',monospace" font-size="24" fill="#BFE3FF">Vibe Coder | AI-Assisted Developer | Photography Enthusiast</text>
  <rect x="902" y="249" width="14" height="26" fill="#00E5FF">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- corner details -->
  <text x="1140" y="95" text-anchor="end" font-family="'Fira Code','Courier New',monospace" font-size="14" fill="#0A84FF" fill-opacity="0.7">Dhaka, Bangladesh</text>
  <path d="M1100 300H1170V270" fill="none" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M30 300H100" fill="none" stroke="#0A84FF" stroke-opacity="0.5" stroke-width="2"/>
</svg>
